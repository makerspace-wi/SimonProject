; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ESP32_WROOM]
platform = espressif32
board = wemos_d1_uno32
framework = arduino
monitor_port = /dev/cu.usbserial-110
monitor_speed = 115200
build_flags =
  -DUART_DEBUG_BAUD=115200
  -DUART_SIGNAL_BAUD=4800
  -DUART_SIGNAL_RX_PIN=16
  -DUART_SIGNAL_TX_PIN=17
  -DUART_MODULE2_BAUD=19200
  -DUART_MODULE2_RX_PIN=27
  -DUART_MODULE2_TX_PIN=26
  ; Anzahl Bitzeiten fuer BREAK (z. B. 24 ~= 1.25 ms bei 19200)
  -DUART_MODULE2_BREAK_BITS=24
  ; Optional: RS485 Driver-Enable-Pin, -1 deaktiviert
  -DUART_MODULE2_RS485_DE_PIN=-1
  -DI2C_ADDR_1=0x38
  -DI2C_ADDR_2=0x39
  -DI2C_ADDR_3=0x3A
  ; Optional: bei Bedarf aktivieren und auf dein Board anpassen
  ; -DI2C_SDA_PIN=21
  ; -DI2C_SCL_PIN=22
lib_deps =
  pedroalbuquerque/ESP32WebServer @ ^1.0