; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ESP32_WROOM]
platform = espressif32
board = wemos_d1_uno32
framework = arduino
monitor_port = /dev/cu.usbserial-110
monitor_speed = 115200
build_flags =
  -DUART_DEBUG_BAUD=115200
  -DUART_SIGNAL_BAUD=4800
  -DUART_SIGNAL_RX_PIN=16
  -DUART_SIGNAL_TX_PIN=17
  -DI2C_ADDR_1=0x38
  -DI2C_ADDR_2=0x39
  -DI2C_ADDR_3=0x3A
  ; Optional: bei Bedarf aktivieren und auf dein Board anpassen
  ; -DI2C_SDA_PIN=21
  ; -DI2C_SCL_PIN=22
lib_deps =
  pedroalbuquerque/ESP32WebServer @ ^1.0