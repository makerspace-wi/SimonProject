* {
  box-sizing: border-box;
  font-family: 'Tahoma', sans-serif;

}

html, body {
  margin: 0;
  height: 100%;
  padding: 0;
  background: linear-gradient(to left top, #2FECF7, #0DFF82);
  background-repeat: no-repeat;
  background-size: cover;
  font-size: 20px;
}

form {
  background-color: white;
  border-radius: 10px;
  -webkit-box-shadow: 5px 5px 20px 0px #adadad;
  -moz-box-shadow: 5px 5px 20px 0px #adadad;
  box-shadow: 5px 5px 20px 0px #adadad;
  padding: 1.5em;
  margin: 3em;
}

h2 {
  text-align: center;
  font-size: 35px;
  padding: 0;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 5px;
}

input, select {
  padding: 10px 16px;
  width: 100%;
  outline: 0;
  margin-bottom: 20px;
  border-radius: 5px;
  border: 0;
  background-color: #ededed;
  font-weight: 700;
  font-size: 20px;
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
}

.textarea-div {
  width: 100%;
}

textarea {
  padding: 10px;
  width: 100%;
  outline: 0;
  margin-bottom: 20px;
  border-radius: 20px;
  border: 0;
  background-color: #ededed;
  font-size: 14px;
  height: 100px;
}

.btn {
  background-color: #0DFF82;
  padding: 12px 15px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid transparent;
  border-radius: 5px;
  margin-bottom: 10px;
  transition: 0.3s all ease;
  text-align: center;
  vertical-align: middle;
}
.btn:hover {
  background-color: #2FECF7;
}



@media screen and (max-width: 1000px) {
 body { 
    padding: 0;
    margin: 0;
}

.btn {
  font-size: 20px;
  margin-bottom: 25px;
}

html, body, input[type='text'],input[type='number'], select, input[type='reset'] {
   font-size: 35px;
  }

input, select, .btn { 
border-radius: 15px;
}

.smallest-group {
    width: 99%;
}

.small-group {
    width: 99%;
}
.medium-group {
    width: 99%;
}

.halbmobil {
  width: 48%;
  float: left;
}

.halbmobil {
   margin-right: 2%;
}

form {
    padding: 0.8em;
    margin: 0;
    border-radius: 0;
  }

}


@media screen and (min-width: 1000px) {


  .large-group {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
  }

  .small-group {
    width: 48%;
  }
 .smallest-group {
    width: 18%;
  }
 .medium-group {
    width: 32%;
  }
}

</style>
